---
- name: Apply Kubernetes manifests
  kubernetes.core.k8s:
    state: present
    src: "{{ item }}"
    kubeconfig: "{{ ansible_env.HOME }}/.kube/config"
  loop:
    - "{{ playbook_dir }}/../../k8s/configmap.yml"
    - "{{ playbook_dir }}/../../k8s/sa.yml"
    - "{{ playbook_dir }}/../../k8s/deployment.yml"
    - "{{ playbook_dir }}/../../k8s/service.yml"
    - "{{ playbook_dir }}/../../k8s/alb-ingress.yml"

- name: Wait for application deployment
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ app_deployment_name }}"
    namespace: "{{ app_namespace }}"
    kubeconfig: "{{ ansible_facts['env']['HOME'] }}/.kube/config"
  register: deployment_info
  until:
    - deployment_info.resources | length > 0
    - deployment_info.resources[0].status.readyReplicas | default(0) | int == deployment_info.resources[0].spec.replicas | int
  retries: 30
  delay: 10
